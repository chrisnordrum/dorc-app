name: Audit and Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  audit-and-update:
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit || true

      - name: Update dependencies
        run: npm update

      - name: Check for vulnerabilities
        run: |
          echo "## Workspace audit" >> $GITHUB_STEP_SUMMARY
          if npm audit --audit-level=moderate; then
            echo "No moderate, high, or critical vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          else
            echo "Moderate or higher vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git add client/package.json server/package.json packages/shared/package.json

          git diff --staged --quiet || git commit -m "chore: update npm dependencies [skip ci]"
          git push