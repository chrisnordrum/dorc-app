# One job, one Node version: we control the runtime (server/package.json `engines`), so a
# version matrix only tests runtimes we never deploy to. Steps run cheapest-first so a
# failure surfaces as early as possible.

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # format:check arrives with roadmap 1.4. Until then this warns instead of failing;
      # 1.4 replaces the whole block with `run: npm run format:check`.
      - name: Format check
        run: |
          if [ "$(npm pkg get scripts.format:check)" = "{}" ]; then
            echo "::warning title=Format check skipped::No root format:check script yet (roadmap 1.4)"
          else
            npm run format:check
          fi

      - name: Typecheck
        run: npm run typecheck

      # test arrives with roadmap 1.5. Same deal: 1.5 replaces this with `run: npm test`.
      - name: Test
        run: |
          if [ "$(npm pkg get scripts.test)" = "{}" ]; then
            echo "::warning title=Tests skipped::No root test script yet (roadmap 1.5)"
          else
            npm test
          fi

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high
